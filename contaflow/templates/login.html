<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · {{ APP_NAME }}</title>
  <link rel="stylesheet" href="/static/estilos.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(140deg,#1f3864,#2f5597)">
  <div class="panel" style="width:370px;margin:0">
    <h1 style="margin-bottom:2px">{{ APP_NAME }}</h1>
    <p class="subtitulo">Sistema contable chileno multiempresa</p>
    {% if error %}<div class="aviso error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="campo">
        <label for="username">Usuario</label>
        <input id="username" name="username" value="admin" autofocus required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button class="btn" style="width:100%">Ingresar</button>
    </form>
    <p class="ayuda" style="margin-top:14px">
      Primer ingreso: usuario <strong>admin</strong>, contraseña <strong>admin</strong>.
      Cámbiala en Configuración → Respaldos.
    </p>
  </div>
</body>
</html>
