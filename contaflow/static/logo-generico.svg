<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ContAll">
  <!--
    Escudo de reserva. Se usa sólo mientras no exista un logotipo propio en
    contaflow/static/ (logo.png, logo.jpg o logo.svg).
    Paleta: azul marino #14294B y dorado #DDB166.
  -->
  <defs>
    <linearGradient id="oro" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C99B4F"/>
      <stop offset="1" stop-color="#E8C888"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="#14294B"/>

  <!-- Flecha ascendente: la curva de crecimiento -->
  <path d="M96 372 C 176 366, 268 320, 344 214"
        fill="none" stroke="url(#oro)" stroke-width="30" stroke-linecap="round"/>
  <path d="M300 206 L392 176 L378 272 Z" fill="url(#oro)"/>

  <!-- Iniciales -->
  <text x="256" y="196" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="132" font-weight="bold"
        fill="#FFFFFF" letter-spacing="4">MSA</text>

  <!-- Regla dorada -->
  <rect x="128" y="408" width="256" height="9" rx="4.5" fill="url(#oro)"/>
</svg>
